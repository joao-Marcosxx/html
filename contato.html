    <div class="form-container">
        <h2>Essa pagina e feita para recomendaçoes e sugestoes, qualquer coisa entre em contato</h2>
        <form id="form-contato">
            <div class="input-grupo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required placeholder="Seu nome completo">
            </div>
            <div class="input-grupo">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu.email@exemplo.com">
            </div>
            <div class="input-grupo">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" rows="5" required placeholder="Digite sua mensagem"></textarea>
            </div>
            <button type="submit">Enviar</button>
        </form>
    </div>
